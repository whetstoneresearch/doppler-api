    SolanaLaunchReadResponse:
      type: object
      additionalProperties: false
      properties:
        network:
          $ref: '#/components/schemas/SolanaNetwork'
        launchAddress:
          $ref: '#/components/schemas/SolanaAddress'
        phase:
          type: object
          additionalProperties: false
          properties:
            code:
              type: integer
            label:
              type: string
          required: [code, label]
        authority:
          $ref: '#/components/schemas/SolanaAddress'
        namespace:
          $ref: '#/components/schemas/SolanaAddress'
        baseMint:
          $ref: '#/components/schemas/SolanaAddress'
        quoteMint:
          $ref: '#/components/schemas/SolanaAddress'
        baseVault:
          $ref: '#/components/schemas/SolanaAddress'
        quoteVault:
          $ref: '#/components/schemas/SolanaAddress'
        baseTotalSupply:
          $ref: '#/components/schemas/IntegerString'
        baseForDistribution:
          $ref: '#/components/schemas/IntegerString'
        baseForLiquidity:
          $ref: '#/components/schemas/IntegerString'
        baseForCurve:
          $ref: '#/components/schemas/IntegerString'
        curveVirtualBase:
          $ref: '#/components/schemas/IntegerString'
        curveVirtualQuote:
          $ref: '#/components/schemas/IntegerString'
        curveFeeBps:
          type: integer
        swapFeeBps:
          type: integer
        allowBuy:
          type: boolean
        allowSell:
          type: boolean
        hookProgram:
