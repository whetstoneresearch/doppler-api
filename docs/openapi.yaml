openapi: 3.1.0
info:
  title: Doppler Launch API
  version: 0.2.0
  description: |
    REST API for creating Doppler launches on EVM and Solana.
    EVM requests use static, multicurve, or dynamic auctions. Static and
    multicurve requests omit migration, while dynamic requests require
    uniswapV2 or uniswapV4 migration.
servers:
  - url: http://localhost:3000
security:
  - ApiKeyAuth: []
paths:
  /v1/launches:
    post:
      summary: Create an EVM launch through the shared route, or create a Solana launch
      description: >-
        The shared EVM launch route accepts static, multicurve, and dynamic EVM
        requests. It also accepts the shared-route Solana network values.
      operationId: createLaunch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SharedEvmCreateLaunchRequest'
                - $ref: '#/components/schemas/SharedRouteSolanaCreateLaunchRequest'
      responses:
        '200':
          $ref: '#/components/responses/CreateResponse'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/launches/static:
    post:
      summary: Create a static EVM launch
      description: Family-specific route; auction.type must be static.
      operationId: createStaticLaunch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvmStaticCreateLaunchRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvmCreateResponse'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/launches/multicurve:
    post:
      summary: Create a multicurve EVM launch
      description: Family-specific route; auction.type must be multicurve.
      operationId: createMulticurveLaunch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvmMulticurveCreateLaunchRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvmCreateResponse'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/launches/dynamic:
    post:
      summary: Create a dynamic EVM launch
      description: Family-specific route; auction.type must be dynamic.
      operationId: createDynamicLaunch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvmDynamicCreateLaunchRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvmCreateResponse'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          description: INVALID_REQUEST covers unsupported EVM fields and poolFeeBeneficiaries with uniswapV2 migration.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/solana/launches:
    post:
      summary: Create a dedicated Solana launch
      operationId: createSolanaLaunch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DedicatedSolanaCreateLaunchRequest'
      responses:
        '200':
          $ref: '#/components/responses/SolanaCreateResponse'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '501':
          description: SOLANA_NETWORK_UNSUPPORTED is returned for Mainnet Beta.
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/launches/{launchId}:
    get:
      summary: Read EVM launch status
      operationId: getLaunchStatus
      parameters:
        - name: launchId
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d+:0x[a-fA-F0-9]{64}$'
      responses:
        '200':
          $ref: '#/components/responses/StatusResponse'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /v1/solana/launches/{launchAddress}:
    get:
      summary: Read Solana launch state
      operationId: getSolanaLaunch
      parameters:
        - name: launchAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Solana launch state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolanaLaunchReadResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /v1/capabilities:
    get:
      summary: List configured launch capabilities
      operationId: getCapabilities
      responses:
        '200':
          description: Configured chains only; RPC values are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /health:
    get:
      summary: Process health
      operationId: health
      security: []
      responses:
        '200':
          description: Healthy process
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok
                required: [status]
        '429':
          $ref: '#/components/responses/Error'
  /ready:
    get:
      summary: Dependency readiness
      operationId: ready
      responses:
        '200':
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /metrics:
    get:
      summary: Service metrics
      operationId: metrics
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required in shared deployments; reuse only with an identical create body.
      schema:
        type: string
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CreateResponse:
      description: Launch submitted
      headers:
        X-Idempotency-Replayed:
          description: Present with value "true" when a completed request is replayed.
          schema:
            type: string
            const: 'true'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/CreateLaunchResponse'
              - $ref: '#/components/schemas/SolanaCreateLaunchResponse'
    EvmCreateResponse:
      description: EVM launch submitted
      headers:
        X-Idempotency-Replayed:
          description: Present with value "true" when a completed request is replayed.
          schema:
            type: string
            const: 'true'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateLaunchResponse'
    SolanaCreateResponse:
      description: Solana launch submitted
      headers:
        X-Idempotency-Replayed:
          description: Present with value "true" when a completed request is replayed.
          schema:
            type: string
            const: 'true'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SolanaCreateLaunchResponse'
    StatusResponse:
      description: EVM launch status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LaunchStatusResponse'
  schemas:
    HexAddress:
      type: string
      pattern: '^0x[a-fA-F0-9]{40}$'
    NonZeroHexAddress:
      allOf:
        - $ref: '#/components/schemas/HexAddress'
        - not:
            const: '0x0000000000000000000000000000000000000000'
    HexHash:
      type: string
      pattern: '^0x[a-fA-F0-9]{64}$'
    IntegerString:
      type: string
      pattern: '^\d+$'
    PositiveIntegerString:
      type: string
      pattern: '^[1-9]\d*$'
    PositiveUint256String:
      type: string
      pattern: '^(?:[1-9]\d{0,76}|(?:100|101|102|103|104|105|106|107|108|109|110|111|112|113|114)\d{75}|115(?:[0-6]\d{2}|7[0-8]\d{1}|790|791)\d{72}|115792(?:0[0-7]\d{1}|08[0-7]|088)\d{69}|115792089(?:[0-1]\d{2}|2[0-2]\d{1}|23[0-5]|236)\d{66}|115792089237(?:[0-2]\d{2}|30\d{1}|31[0-4]|315)\d{63}|115792089237316(?:0\d{2}|1[0-8]\d{1}|19[0-3]|194)\d{60}|115792089237316195(?:[0-3]\d{2}|4[0-1]\d{1}|42[0-1]|422)\d{57}|115792089237316195423(?:[0-4]\d{2}|5[0-5]\d{1}|56[0-8]|569)\d{54}|115792089237316195423570(?:[0-8]\d{2}|9[0-7]\d{1}|98[0-3]|984)\d{51}|115792089237316195423570985(?:00[0-6]|007)\d{48}|115792089237316195423570985008(?:[0-5]\d{2}|6[0-7]\d{1}|68[0-5]|686)\d{45}|115792089237316195423570985008687(?:[0-8]\d{2}|90[0-5]|906)\d{42}|115792089237316195423570985008687907(?:[0-7]\d{2}|8[0-4]\d{1}|85[0-1]|852)\d{39}|115792089237316195423570985008687907853(?:[0-1]\d{2}|2[0-5]\d{1}|26[0-7]|268)\d{36}|115792089237316195423570985008687907853269(?:[0-8]\d{2}|9[0-7]\d{1}|98[0-2]|983)\d{33}|115792089237316195423570985008687907853269984(?:[0-5]\d{2}|6[0-5]\d{1}|66[0-3]|664)\d{30}|115792089237316195423570985008687907853269984665(?:[0-5]\d{2}|6[0-2]\d{1}|63[0-8]|639)\d{27}|115792089237316195423570985008687907853269984665640(?:[0-4]\d{2}|5[0-5]\d{1}|56[0-2]|563)\d{24}|115792089237316195423570985008687907853269984665640564(?:0[0-2]\d{1}|03[0-7]|038)\d{21}|115792089237316195423570985008687907853269984665640564039(?:[0-3]\d{2}|4[0-4]\d{1}|45[0-5]|456)\d{18}|115792089237316195423570985008687907853269984665640564039457(?:[0-4]\d{2}|5[0-7]\d{1}|58[0-2]|583)\d{15}|115792089237316195423570985008687907853269984665640564039457584(?:00[0-5]|006)\d{12}|115792089237316195423570985008687907853269984665640564039457584007(?:[0-8]\d{2}|90\d{1}|91[0-1]|912)\d{9}|115792089237316195423570985008687907853269984665640564039457584007913(?:0\d{2}|1[0-1]\d{1}|12[0-7]|128)\d{6}|115792089237316195423570985008687907853269984665640564039457584007913129(?:[0-5]\d{2}|6[0-2]\d{1}|63[0-7]|638)\d{3}|115792089237316195423570985008687907853269984665640564039457584007913129639(?:[0-8]\d{2}|9[0-2]\d{1}|93[0-3]|934)|115792089237316195423570985008687907853269984665640564039457584007913129639935)$'
      description: A canonical positive uint256 decimal string without leading zeros, at most 2^256 - 1.
    Uint256Decimal18String:
      type: string
      pattern: '^(?:(?:0|(?:[1-9]\d{0,58}|10\d{58}|11[0-4]\d{57}|115[0-6]\d{56}|1157[0-8]\d{55}|11579[0-1]\d{54}|1157920[0-7]\d{52}|11579208[0-8]\d{51}|115792089[0-1]\d{50}|1157920892[0-2]\d{49}|11579208923[0-6]\d{48}|115792089237[0-2]\d{47}|11579208923730\d{46}|11579208923731[0-5]\d{45}|1157920892373160\d{44}|1157920892373161[0-8]\d{43}|11579208923731619[0-4]\d{42}|115792089237316195[0-3]\d{41}|1157920892373161954[0-1]\d{40}|11579208923731619542[0-2]\d{39}|115792089237316195423[0-4]\d{38}|1157920892373161954235[0-6]\d{37}|115792089237316195423570[0-8]\d{35}|1157920892373161954235709[0-7]\d{34}|11579208923731619542357098[0-4]\d{33}|11579208923731619542357098500[0-7]\d{30}|115792089237316195423570985008[0-5]\d{29}|1157920892373161954235709850086[0-7]\d{28}|11579208923731619542357098500868[0-6]\d{27}|115792089237316195423570985008687[0-8]\d{26}|11579208923731619542357098500868790[0-6]\d{24}|115792089237316195423570985008687907[0-7]\d{23}|1157920892373161954235709850086879078[0-4]\d{22}|11579208923731619542357098500868790785[0-2]\d{21}|115792089237316195423570985008687907853[0-1]\d{20}|1157920892373161954235709850086879078532[0-5]\d{19}|11579208923731619542357098500868790785326[0-8]\d{18}|115792089237316195423570985008687907853269[0-8]\d{17}|1157920892373161954235709850086879078532699[0-7]\d{16}|11579208923731619542357098500868790785326998[0-3]\d{15}|115792089237316195423570985008687907853269984[0-5]\d{14}|1157920892373161954235709850086879078532699846[0-5]\d{13}|11579208923731619542357098500868790785326998466[0-4]\d{12}|115792089237316195423570985008687907853269984665[0-5]\d{11}|1157920892373161954235709850086879078532699846656[0-3]\d{10}|115792089237316195423570985008687907853269984665640[0-4]\d{8}|1157920892373161954235709850086879078532699846656405[0-5]\d{7}|11579208923731619542357098500868790785326998466564056[0-3]\d{6}|1157920892373161954235709850086879078532699846656405640[0-2]\d{4}|11579208923731619542357098500868790785326998466564056403[0-8]\d{3}|115792089237316195423570985008687907853269984665640564039[0-3]\d{2}|1157920892373161954235709850086879078532699846656405640394[0-4]\d{1}|11579208923731619542357098500868790785326998466564056403945[0-5]|115792089237316195423570985008687907853269984665640564039456))(?:\.\d{1,18})?|115792089237316195423570985008687907853269984665640564039457(?:\.(?:(?:[0-4]|5)|(?:[0-4]\d{1}|5[0-7]|58)|(?:[0-4]\d{2}|5[0-7]\d{1}|58[0-3]|584)|(?:[0-4]\d{3}|5[0-7]\d{2}|58[0-3]\d{1}|5840)|(?:[0-4]\d{4}|5[0-7]\d{3}|58[0-3]\d{2}|58400)|(?:[0-4]\d{5}|5[0-7]\d{4}|58[0-3]\d{3}|58400[0-6]|584007)|(?:[0-4]\d{6}|5[0-7]\d{5}|58[0-3]\d{4}|58400[0-6]\d{1}|584007[0-8]|5840079)|(?:[0-4]\d{7}|5[0-7]\d{6}|58[0-3]\d{5}|58400[0-6]\d{2}|584007[0-8]\d{1}|58400790|58400791)|(?:[0-4]\d{8}|5[0-7]\d{7}|58[0-3]\d{6}|58400[0-6]\d{3}|584007[0-8]\d{2}|58400790\d{1}|58400791[0-2]|584007913)|(?:[0-4]\d{9}|5[0-7]\d{8}|58[0-3]\d{7}|58400[0-6]\d{4}|584007[0-8]\d{3}|58400790\d{2}|58400791[0-2]\d{1}|5840079130|5840079131)|(?:[0-4]\d{10}|5[0-7]\d{9}|58[0-3]\d{8}|58400[0-6]\d{5}|584007[0-8]\d{4}|58400790\d{3}|58400791[0-2]\d{2}|5840079130\d{1}|5840079131[0-1]|58400791312)|(?:[0-4]\d{11}|5[0-7]\d{10}|58[0-3]\d{9}|58400[0-6]\d{6}|584007[0-8]\d{5}|58400790\d{4}|58400791[0-2]\d{3}|5840079130\d{2}|5840079131[0-1]\d{1}|58400791312[0-8]|584007913129)|(?:[0-4]\d{12}|5[0-7]\d{11}|58[0-3]\d{10}|58400[0-6]\d{7}|584007[0-8]\d{6}|58400790\d{5}|58400791[0-2]\d{4}|5840079130\d{3}|5840079131[0-1]\d{2}|58400791312[0-8]\d{1}|584007913129[0-5]|5840079131296)|(?:[0-4]\d{13}|5[0-7]\d{12}|58[0-3]\d{11}|58400[0-6]\d{8}|584007[0-8]\d{7}|58400790\d{6}|58400791[0-2]\d{5}|5840079130\d{4}|5840079131[0-1]\d{3}|58400791312[0-8]\d{2}|584007913129[0-5]\d{1}|5840079131296[0-2]|58400791312963)|(?:[0-4]\d{14}|5[0-7]\d{13}|58[0-3]\d{12}|58400[0-6]\d{9}|584007[0-8]\d{8}|58400790\d{7}|58400791[0-2]\d{6}|5840079130\d{5}|5840079131[0-1]\d{4}|58400791312[0-8]\d{3}|584007913129[0-5]\d{2}|5840079131296[0-2]\d{1}|58400791312963[0-8]|584007913129639)|(?:[0-4]\d{15}|5[0-7]\d{14}|58[0-3]\d{13}|58400[0-6]\d{10}|584007[0-8]\d{9}|58400790\d{8}|58400791[0-2]\d{7}|5840079130\d{6}|5840079131[0-1]\d{5}|58400791312[0-8]\d{4}|584007913129[0-5]\d{3}|5840079131296[0-2]\d{2}|58400791312963[0-8]\d{1}|584007913129639[0-8]|5840079131296399)|(?:[0-4]\d{16}|5[0-7]\d{15}|58[0-3]\d{14}|58400[0-6]\d{11}|584007[0-8]\d{10}|58400790\d{9}|58400791[0-2]\d{8}|5840079130\d{7}|5840079131[0-1]\d{6}|58400791312[0-8]\d{5}|584007913129[0-5]\d{4}|5840079131296[0-2]\d{3}|58400791312963[0-8]\d{2}|584007913129639[0-8]\d{1}|5840079131296399[0-2]|58400791312963993)|(?:[0-4]\d{17}|5[0-7]\d{16}|58[0-3]\d{15}|58400[0-6]\d{12}|584007[0-8]\d{11}|58400790\d{10}|58400791[0-2]\d{9}|5840079130\d{8}|5840079131[0-1]\d{7}|58400791312[0-8]\d{6}|584007913129[0-5]\d{5}|5840079131296[0-2]\d{4}|58400791312963[0-8]\d{3}|584007913129639[0-8]\d{2}|5840079131296399[0-2]\d{1}|58400791312963993[0-4]|584007913129639935)))?)$'
      description: A canonical non-negative decimal string with at most 18 decimal places whose value in 18-decimal units is at most 2^256 - 1.
    MaxShareWadString:
      type: string
      pattern: '^(?:[1-9]\d{0,17}|1000000000000000000)$'
      description: A positive integer no greater than 1e18.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required: [code, message]
      required: [error]
    TokenMetadata:
      type: object
      additionalProperties: false
      description: Token metadata and optional balance-limit controls.
      properties:
        name:
          type: string
          minLength: 1
        symbol:
          type: string
          minLength: 1
        tokenURI:
          type: string
          minLength: 1
        maxBalanceLimit:
          $ref: '#/components/schemas/PositiveUint256String'
          description: Enables balance limiting; required with balanceLimitEnd and must be below totalSupply.
        balanceLimitEnd:
          type: integer
          minimum: 0
          maximum: 281474976710655
          description: Future Unix timestamp; required with maxBalanceLimit.
        balanceController:
          $ref: '#/components/schemas/NonZeroHexAddress'
        excludedFromBalanceLimit:
          type: array
          description: Case-insensitively unique addresses; requires balance limiting to be enabled.
          items:
            $ref: '#/components/schemas/HexAddress'
      required: [name, symbol, tokenURI]
    VestingAllocation:
      type: object
      additionalProperties: false
      properties:
        recipientAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        amount:
          $ref: '#/components/schemas/PositiveUint256String'
        durationSeconds:
          type: integer
          minimum: 86400
          maximum: 4294967295
        cliffDurationSeconds:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Must not exceed durationSeconds.
      required: [recipientAddress, amount, durationSeconds]
    Economics:
      type: object
      additionalProperties: false
      properties:
        totalSupply:
          $ref: '#/components/schemas/PositiveUint256String'
        tokensForSale:
          $ref: '#/components/schemas/PositiveUint256String'
          description: >-
            Defaults to totalSupply, or to totalSupply minus explicit allocations.
            Must be at least 20% of totalSupply when it is lower than totalSupply.
        allocations:
          type: array
          minItems: 1
          maxItems: 10
          description: >-
            Independent vesting schedules whose amounts sum to totalSupply minus
            tokensForSale. A recipient may appear more than once. When tokensForSale
            leaves an allocation and allocations is omitted, the API creates one
            90-day, no-cliff allocation for userAddress.
          items:
            $ref: '#/components/schemas/VestingAllocation'
      required: [totalSupply]
    PoolFeeBeneficiary:
      type: object
      description: >-
        Pool-fee shares use positive WAD strings and case-insensitively unique
        addresses. Request shares total 95% when the protocol owner is omitted, or
        100% with at least 5% assigned to that owner when included.
      additionalProperties: false
      properties:
        address:
          $ref: '#/components/schemas/NonZeroHexAddress'
        sharesWad:
          $ref: '#/components/schemas/PositiveIntegerString'
      required: [address, sharesWad]
    RehypeFeeBeneficiary:
      type: object
      additionalProperties: false
      description: >-
        Receives a share of Rehype beneficiary-routed fees. This list is separate from
        poolFeeBeneficiaries and does not require the Airlock owner.
      properties:
        address:
          $ref: '#/components/schemas/NonZeroHexAddress'
        sharesWad:
          $ref: '#/components/schemas/PositiveIntegerString'
      required: [address, sharesWad]
    Governance:
      description: false or omitted maps to noOp; true maps to default; an EVM address selects custom governance with that multisig.
      oneOf:
        - type: boolean
        - $ref: '#/components/schemas/NonZeroHexAddress'
    Pairing:
      type: object
      additionalProperties: false
      properties:
        numeraireAddress:
          $ref: '#/components/schemas/HexAddress'
          description: Defaults to the chain's configured numeraire, then WETH.
    Pricing:
      type: object
      additionalProperties: false
      properties:
        numerairePriceUsd:
          type: number
          exclusiveMinimum: 0
          description: Optional positive USD override; otherwise the configured pricing source resolves it.
    StaticCurveConfig:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            type:
              const: preset
            preset:
              type: string
              enum: [low, medium, high]
            fee:
              type: integer
              enum: [100, 500, 3000, 10000]
              default: 10000
            numPositions:
              type: integer
              minimum: 1
              maximum: 65535
              default: 15
            maxShareToBeSoldWad:
              $ref: '#/components/schemas/MaxShareWadString'
              description: Defaults to 350000000000000000 (35%).
          required: [type, preset]
        - type: object
          additionalProperties: false
          properties:
            type:
              const: range
            marketCapStartUsd:
              type: number
              exclusiveMinimum: 0
            marketCapEndUsd:
              type: number
              exclusiveMinimum: 0
            fee:
              type: integer
              enum: [100, 500, 3000, 10000]
              default: 10000
            numPositions:
              type: integer
              minimum: 1
              maximum: 65535
              default: 15
            maxShareToBeSoldWad:
              $ref: '#/components/schemas/MaxShareWadString'
              description: Defaults to 350000000000000000 (35%).
          required: [type, marketCapStartUsd, marketCapEndUsd]
    StaticAuction:
      type: object
      additionalProperties: false
      properties:
        type:
          const: static
        curveConfig:
          $ref: '#/components/schemas/StaticCurveConfig'
      required: [type, curveConfig]
    MulticurveCurveConfig:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            type:
              const: preset
            presets:
              type: array
              items:
                type: string
                enum: [low, medium, high]
              default: [low, medium, high]
              description: Omitted or empty selects all three presets.
            fee:
              type: integer
              minimum: 0
              maximum: 100000
              default: 500
            tickSpacing:
              type: integer
              minimum: 1
              maximum: 32767
              description: >-
                When omitted for presets, the API selects the largest spacing no greater
                than the fee-tier default that divides every selected preset boundary.
          required: [type]
        - type: object
          additionalProperties: false
          properties:
            type:
              const: ranges
            fee:
              type: integer
              minimum: 0
              maximum: 100000
              default: 3000
            tickSpacing:
              type: integer
              minimum: 1
              maximum: 32767
              description: >-
                Standard fee tiers use the SDK default when omitted; custom fees derive
                a spacing unless one is supplied.
            curves:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                properties:
                  marketCapStartUsd:
                    type: number
                    exclusiveMinimum: 0
                  marketCapEndUsd:
                    oneOf:
                      - type: number
                        exclusiveMinimum: 0
                      - const: max
                  numPositions:
                    type: integer
                    minimum: 1
                    maximum: 65535
                  sharesWad:
                    $ref: '#/components/schemas/PositiveIntegerString'
                required: [marketCapStartUsd, marketCapEndUsd, numPositions, sharesWad]
          required: [type, curves]
    RehypeFeeDistributionInfo:
      type: object
      additionalProperties: false
      description: Asset-side fields and numeraire-side fields must each sum to 1e18.
      properties:
        assetFeesToAssetBuybackWad:
          $ref: '#/components/schemas/IntegerString'
        assetFeesToNumeraireBuybackWad:
          $ref: '#/components/schemas/IntegerString'
        assetFeesToBeneficiaryWad:
          $ref: '#/components/schemas/IntegerString'
        assetFeesToLpWad:
          $ref: '#/components/schemas/IntegerString'
        numeraireFeesToAssetBuybackWad:
          $ref: '#/components/schemas/IntegerString'
        numeraireFeesToNumeraireBuybackWad:
          $ref: '#/components/schemas/IntegerString'
        numeraireFeesToBeneficiaryWad:
          $ref: '#/components/schemas/IntegerString'
        numeraireFeesToLpWad:
          $ref: '#/components/schemas/IntegerString'
      required:
        [
          assetFeesToAssetBuybackWad,
          assetFeesToNumeraireBuybackWad,
          assetFeesToBeneficiaryWad,
          assetFeesToLpWad,
          numeraireFeesToAssetBuybackWad,
          numeraireFeesToNumeraireBuybackWad,
          numeraireFeesToBeneficiaryWad,
          numeraireFeesToLpWad,
        ]
    RehypeInitializer:
      type: object
      additionalProperties: false
      description: Mandatory flattened Rehype initializer for every multicurve launch.
      properties:
        buybackDestination:
          $ref: '#/components/schemas/NonZeroHexAddress'
        rehypeFeeBeneficiaries:
          type: array
          minItems: 1
          maxItems: 10
          description: >-
            Case-insensitively unique Rehype fee beneficiaries whose positive shares
            sum to 1e18. Mutually exclusive with buybackDestination. Shares apply only
            to beneficiary-routed fees after the protocol owner's reserved fee.
          items:
            $ref: '#/components/schemas/RehypeFeeBeneficiary'
        startFee:
          type: integer
          minimum: 0
          maximum: 800000
        endFee:
          type: integer
          minimum: 0
          maximum: 800000
          description: Defaults to startFee and cannot exceed it.
        durationSeconds:
          type: integer
          minimum: 0
          maximum: 4294967295
          default: 0
          description: Must be greater than 0 when startFee exceeds endFee.
        startingTime:
          type: integer
          minimum: 0
          maximum: 4294967295
          default: 0
        feeDistributionInfo:
          $ref: '#/components/schemas/RehypeFeeDistributionInfo'
      allOf:
        - oneOf:
            - required: [buybackDestination]
              not:
                required: [rehypeFeeBeneficiaries]
            - required: [rehypeFeeBeneficiaries]
              not:
                required: [buybackDestination]
      required: [startFee, feeDistributionInfo]
    MulticurveAuction:
      type: object
      additionalProperties: false
      properties:
        type:
          const: multicurve
        curveConfig:
          $ref: '#/components/schemas/MulticurveCurveConfig'
        initializer:
          $ref: '#/components/schemas/RehypeInitializer'
      required: [type, curveConfig, initializer]
    DynamicCurveConfig:
      type: object
      additionalProperties: false
      properties:
        type:
          const: range
        marketCapStartUsd:
          type: number
          exclusiveMinimum: 0
        marketCapMinUsd:
          type: number
          exclusiveMinimum: 0
        minProceeds:
          $ref: '#/components/schemas/Uint256Decimal18String'
          description: Non-negative amount not above maxProceeds.
        maxProceeds:
          allOf:
            - $ref: '#/components/schemas/Uint256Decimal18String'
            - not:
                pattern: '^0(?:\.0{1,18})?$'
          description: Positive amount not below minProceeds.
        durationSeconds:
          type: integer
          minimum: 1
          description: Must be evenly divisible by epochLengthSeconds after defaults are applied.
          default: 604800
        epochLengthSeconds:
          type: integer
          minimum: 1
          description: Must divide durationSeconds evenly after defaults are applied.
          default: 43200
        fee:
          type: integer
          minimum: 0
          maximum: 100000
          default: 10000
        tickSpacing:
          type: integer
          minimum: 1
          maximum: 30
          description: Required when fee is not one of 100, 500, 3000, or 10000.
          default: 30
        gamma:
          type: integer
          minimum: 1
          maximum: 8388607
          description: Defaults to the SDK-computed value and must be divisible by effective tickSpacing.
        numPdSlugs:
          type: integer
          minimum: 1
          maximum: 15
          default: 5
      required: [type, marketCapStartUsd, marketCapMinUsd, minProceeds, maxProceeds]
    DynamicAuction:
      type: object
      additionalProperties: false
      properties:
        type:
          const: dynamic
        curveConfig:
          $ref: '#/components/schemas/DynamicCurveConfig'
      required: [type, curveConfig]
    UniswapV2Migration:
      type: object
      description: |
        An optional fee beneficiary receives the selected integer percentage of
        numeraire proceeds. The migration sends 95% of LP positions to the
        migration recipient and 5% to a one-year locker whose exit fees accrue
        to the Airlock owner.
      additionalProperties: false
      properties:
        type:
          const: uniswapV2
        feeBeneficiary:
          type: object
          additionalProperties: false
          properties:
            address:
              $ref: '#/components/schemas/NonZeroHexAddress'
            percentage:
              type: integer
              minimum: 1
              maximum: 50
          required: [address, percentage]
      required: [type]
    UniswapV4Migration:
      type: object
      additionalProperties: false
      description: >-
        Creates a fixed-fee Uniswap V4 pool through DopplerHookMigrator. Add
        rehype to use RehypeDopplerHookMigrator and its separate static hook fee.
      properties:
        type:
          const: uniswapV4
        fee:
          type: integer
          minimum: 0
          maximum: 150000
        tickSpacing:
          type: integer
          minimum: 1
          maximum: 32767
        lockDurationSeconds:
          type: integer
          minimum: 0
          maximum: 4294967295
        rehype:
          type: object
          additionalProperties: false
          properties:
            buybackDestination:
              $ref: '#/components/schemas/NonZeroHexAddress'
            customFee:
              type: integer
              minimum: 0
              maximum: 1000000
              description: Static Rehype hook fee, separate from the Uniswap V4 LP fee.
            feeRoutingMode:
              type: string
              enum: [directBuyback, routeToBeneficiaryFees]
              default: directBuyback
            feeDistributionInfo:
              $ref: '#/components/schemas/RehypeFeeDistributionInfo'
          required: [buybackDestination, customFee, feeDistributionInfo]
      required: [type, fee, tickSpacing, lockDurationSeconds]
    EvmStaticCreateLaunchRequest:
      type: object
      additionalProperties: false
      properties:
        chainId:
          type: integer
          enum: [1, 143, 4663, 8453, 84532]
          description: Required when DEFAULT_CHAIN_ID is not configured. The requested chain must have its named RPC enabled.
        userAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        integrationAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        tokenMetadata:
          $ref: '#/components/schemas/TokenMetadata'
        economics:
          $ref: '#/components/schemas/Economics'
        pairing:
          $ref: '#/components/schemas/Pairing'
        pricing:
          $ref: '#/components/schemas/Pricing'
        poolFeeBeneficiaries:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PoolFeeBeneficiary'
        governance:
          $ref: '#/components/schemas/Governance'
        auction:
          $ref: '#/components/schemas/StaticAuction'
      required: [userAddress, tokenMetadata, economics, auction]
    EvmMulticurveCreateLaunchRequest:
      type: object
      additionalProperties: false
      properties:
        chainId:
          type: integer
          enum: [1, 143, 4663, 8453, 84532]
          description: Required when DEFAULT_CHAIN_ID is not configured. The requested chain must have its named RPC enabled.
        userAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        integrationAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        tokenMetadata:
          $ref: '#/components/schemas/TokenMetadata'
        economics:
          $ref: '#/components/schemas/Economics'
        pairing:
          $ref: '#/components/schemas/Pairing'
        pricing:
          $ref: '#/components/schemas/Pricing'
        poolFeeBeneficiaries:
          type: array
          maxItems: 10
          description: >-
            These beneficiaries lock the multicurve source pool and receive its fees.
