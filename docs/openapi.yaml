openapi: 3.1.0
info:
  title: Doppler Launch API
  version: 0.2.0
  description: |
    REST API for creating Doppler launches on EVM and Solana.
    EVM requests use static, multicurve, or dynamic auctions. Static and
    multicurve requests omit migration, while dynamic requests require
    uniswapV2 or uniswapV4 migration.
servers:
  - url: http://localhost:3000
security:
  - ApiKeyAuth: []
paths:
  /v1/launches:
    post:
      summary: Create an EVM or generic Solana launch
      operationId: createLaunch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateLaunchRequest'
                - $ref: '#/components/schemas/GenericSolanaCreateLaunchRequest'
      responses:
        '200':
          $ref: '#/components/responses/CreateResponse'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/launches/static:
    post:
      summary: Create a static EVM launch
      operationId: createStaticLaunch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvmStaticCreateLaunchRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvmCreateResponse'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/launches/multicurve:
    post:
      summary: Create a multicurve EVM launch
      operationId: createMulticurveLaunch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvmMulticurveCreateLaunchRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvmCreateResponse'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/launches/dynamic:
    post:
      summary: Create a dynamic EVM launch
      operationId: createDynamicLaunch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvmDynamicCreateLaunchRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvmCreateResponse'
        '422':
          description: INVALID_REQUEST covers unsupported EVM fields and poolFeeBeneficiaries with uniswapV2 migration.
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/solana/launches:
    post:
      summary: Create a dedicated Solana launch
      operationId: createSolanaLaunch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DedicatedSolanaCreateLaunchRequest'
      responses:
        '200':
          $ref: '#/components/responses/SolanaCreateResponse'
        '422':
          $ref: '#/components/responses/Error'
        '501':
          description: SOLANA_NETWORK_UNSUPPORTED is returned for Mainnet Beta.
          $ref: '#/components/responses/Error'
  /v1/launches/{launchId}:
    get:
      summary: Read EVM launch status
      operationId: getLaunchStatus
      parameters:
        - name: launchId
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d+:0x[a-fA-F0-9]{64}$'
      responses:
        '200':
          $ref: '#/components/responses/StatusResponse'
        '422':
          $ref: '#/components/responses/Error'
  /v1/solana/launches/{launchAddress}:
    get:
      summary: Read Solana launch state
      operationId: getSolanaLaunch
      parameters:
        - name: launchAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Solana launch state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolanaLaunchReadResponse'
        '422':
          $ref: '#/components/responses/Error'
  /v1/capabilities:
    get:
      summary: List configured launch capabilities
      operationId: getCapabilities
      responses:
        '200':
          description: Configured chains only; RPC values are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /health:
    get:
      summary: Process health
      operationId: health
      security: []
      responses:
        '200':
          description: Healthy process
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok
                required: [status]
        '429':
          $ref: '#/components/responses/Error'
  /ready:
    get:
      summary: Dependency readiness
      operationId: ready
      responses:
        '200':
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /metrics:
    get:
      summary: Service metrics
      operationId: metrics
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required in shared deployments; reuse only with an identical create body.
      schema:
        type: string
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CreateResponse:
      description: Launch submitted
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/CreateLaunchResponse'
              - $ref: '#/components/schemas/SolanaCreateLaunchResponse'
    EvmCreateResponse:
      description: EVM launch submitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateLaunchResponse'
    SolanaCreateResponse:
      description: Solana launch submitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SolanaCreateLaunchResponse'
    StatusResponse:
      description: EVM launch status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LaunchStatusResponse'
  schemas:
    HexAddress:
      type: string
      pattern: '^0x[a-fA-F0-9]{40}$'
    NonZeroHexAddress:
      allOf:
        - $ref: '#/components/schemas/HexAddress'
        - not:
            const: '0x0000000000000000000000000000000000000000'
    HexHash:
      type: string
      pattern: '^0x[a-fA-F0-9]{64}$'
    IntegerString:
      type: string
      pattern: '^\d+$'
    PositiveIntegerString:
      type: string
      pattern: '^[1-9]\d*$'
    MaxShareWadString:
      type: string
      pattern: '^(?:[1-9]\d{0,17}|1000000000000000000)$'
      description: A positive integer no greater than 1e18.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required: [code, message]
      required: [error]
    TokenMetadata:
      type: object
      additionalProperties: false
      description: Token metadata and optional balance-limit controls.
      properties:
        name:
          type: string
          minLength: 1
        symbol:
          type: string
          minLength: 1
        tokenURI:
          type: string
          minLength: 1
        maxBalanceLimit:
          $ref: '#/components/schemas/IntegerString'
        balanceLimitEnd:
          type: integer
          minimum: 0
        controller:
          $ref: '#/components/schemas/NonZeroHexAddress'
        excludedFromBalanceLimit:
          type: array
          items:
            $ref: '#/components/schemas/HexAddress'
      required: [name, symbol, tokenURI]
    VestingAllocation:
      type: object
      additionalProperties: false
      properties:
        recipientAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        amount:
          $ref: '#/components/schemas/IntegerString'
        durationSeconds:
          type: integer
          minimum: 86400
        cliffDurationSeconds:
          type: integer
          minimum: 0
      required: [recipientAddress, amount, durationSeconds]
    Economics:
      type: object
      additionalProperties: false
      properties:
        totalSupply:
          $ref: '#/components/schemas/IntegerString'
        tokensForSale:
          $ref: '#/components/schemas/IntegerString'
        allocations:
          type: array
          minItems: 1
          maxItems: 10
          description: Independent vesting schedules. A recipient may appear more than once.
          items:
            $ref: '#/components/schemas/VestingAllocation'
      required: [totalSupply]
    PoolFeeBeneficiary:
      type: object
      additionalProperties: false
      properties:
        address:
          $ref: '#/components/schemas/NonZeroHexAddress'
        sharesWad:
          $ref: '#/components/schemas/IntegerString'
      required: [address, sharesWad]
    RehypeFeeBeneficiary:
      type: object
      additionalProperties: false
      description: >-
        Receives a share of Rehype beneficiary-routed fees. This list is separate from
        poolFeeBeneficiaries and does not require the Airlock owner.
      properties:
        address:
          $ref: '#/components/schemas/NonZeroHexAddress'
        sharesWad:
          $ref: '#/components/schemas/PositiveIntegerString'
      required: [address, sharesWad]
    Governance:
      description: false or omitted maps to noOp; true maps to default; an EVM address maps to launchpad multisig.
      oneOf:
        - type: boolean
        - $ref: '#/components/schemas/NonZeroHexAddress'
    Pairing:
      type: object
      additionalProperties: false
      properties:
        numeraireAddress:
          $ref: '#/components/schemas/HexAddress'
    Pricing:
      type: object
      additionalProperties: false
      properties:
        numerairePriceUsd:
          type: number
          exclusiveMinimum: 0
    StaticCurveConfig:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            type:
              const: preset
            preset:
              type: string
              enum: [low, medium, high]
            fee:
              type: integer
              enum: [100, 500, 3000, 10000]
            numPositions:
              type: integer
              minimum: 1
              maximum: 65535
            maxShareToBeSoldWad:
              $ref: '#/components/schemas/MaxShareWadString'
          required: [type, preset]
        - type: object
          additionalProperties: false
          properties:
            type:
              const: range
            marketCapStartUsd:
              type: number
              exclusiveMinimum: 0
            marketCapEndUsd:
              type: number
              exclusiveMinimum: 0
            fee:
              type: integer
              enum: [100, 500, 3000, 10000]
            numPositions:
              type: integer
              minimum: 1
              maximum: 65535
            maxShareToBeSoldWad:
              $ref: '#/components/schemas/MaxShareWadString'
          required: [type, marketCapStartUsd, marketCapEndUsd]
    StaticAuction:
      type: object
      additionalProperties: false
      properties:
        type:
          const: static
        curveConfig:
          $ref: '#/components/schemas/StaticCurveConfig'
      required: [type, curveConfig]
    MulticurveCurveConfig:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            type:
              const: preset
            presets:
              type: array
              items:
                type: string
                enum: [low, medium, high]
            fee:
              type: integer
              minimum: 0
              maximum: 100000
            tickSpacing:
              type: integer
              minimum: 1
          required: [type]
        - type: object
          additionalProperties: false
          properties:
            type:
              const: ranges
            fee:
              type: integer
              minimum: 0
              maximum: 100000
            tickSpacing:
              type: integer
              minimum: 1
            curves:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                properties:
                  marketCapStartUsd:
                    type: number
                    exclusiveMinimum: 0
                  marketCapEndUsd:
                    oneOf:
                      - type: number
                        exclusiveMinimum: 0
                      - const: max
                  numPositions:
                    type: integer
                    minimum: 1
                  sharesWad:
                    $ref: '#/components/schemas/IntegerString'
                required: [marketCapStartUsd, marketCapEndUsd, numPositions, sharesWad]
          required: [type, curves]
    RehypeFeeDistributionInfo:
      type: object
      additionalProperties: false
      description: Asset-side fields and numeraire-side fields must each sum to 1e18.
      properties:
        assetFeesToAssetBuybackWad:
          $ref: '#/components/schemas/IntegerString'
        assetFeesToNumeraireBuybackWad:
          $ref: '#/components/schemas/IntegerString'
        assetFeesToBeneficiaryWad:
          $ref: '#/components/schemas/IntegerString'
        assetFeesToLpWad:
          $ref: '#/components/schemas/IntegerString'
        numeraireFeesToAssetBuybackWad:
          $ref: '#/components/schemas/IntegerString'
        numeraireFeesToNumeraireBuybackWad:
          $ref: '#/components/schemas/IntegerString'
        numeraireFeesToBeneficiaryWad:
          $ref: '#/components/schemas/IntegerString'
        numeraireFeesToLpWad:
          $ref: '#/components/schemas/IntegerString'
      required:
        [
          assetFeesToAssetBuybackWad,
          assetFeesToNumeraireBuybackWad,
          assetFeesToBeneficiaryWad,
          assetFeesToLpWad,
          numeraireFeesToAssetBuybackWad,
          numeraireFeesToNumeraireBuybackWad,
          numeraireFeesToBeneficiaryWad,
          numeraireFeesToLpWad,
        ]
    RehypeInitializer:
      type: object
      additionalProperties: false
      properties:
        type:
          const: rehype
        config:
          type: object
          additionalProperties: false
          description: Rehype economic configuration.
          properties:
            buybackDestination:
              $ref: '#/components/schemas/NonZeroHexAddress'
            rehypeFeeBeneficiaries:
              type: array
              minItems: 1
              maxItems: 10
              description: >-
                Unique Rehype fee beneficiaries whose shares sum to 1e18. This field
                and buybackDestination are mutually exclusive. Shares apply only to
                beneficiary-routed fees and exclude the protocol owner's reserved fee.
              items:
                $ref: '#/components/schemas/RehypeFeeBeneficiary'
            startFee:
              type: integer
              minimum: 0
              maximum: 800000
            endFee:
              type: integer
              minimum: 0
              maximum: 800000
            durationSeconds:
              type: integer
              minimum: 0
              maximum: 4294967295
            startingTime:
              type: integer
              minimum: 0
              maximum: 4294967295
            feeDistributionInfo:
              $ref: '#/components/schemas/RehypeFeeDistributionInfo'
            graduationCalldata:
              type: string
              pattern: '^0x[0-9a-fA-F]*$'
            graduationMarketCap:
              type: number
              exclusiveMinimum: 0
            numerairePrice:
              type: number
              exclusiveMinimum: 0
            farTick:
              type: integer
              minimum: -8388608
              maximum: 8388607
              description: Optional int24 graduation tick; mutually exclusive with graduationMarketCap.
          allOf:
            - oneOf:
                - required: [buybackDestination]
                  not:
                    required: [rehypeFeeBeneficiaries]
                - required: [rehypeFeeBeneficiaries]
                  not:
                    required: [buybackDestination]
            - not:
                properties:
                  graduationMarketCap: {}
                  farTick: {}
                required: [graduationMarketCap, farTick]
          required: [startFee, feeDistributionInfo]
      required: [type, config]
    MulticurveAuction:
      type: object
      additionalProperties: false
      properties:
        type:
          const: multicurve
        curveConfig:
          $ref: '#/components/schemas/MulticurveCurveConfig'
        initializer:
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                type:
                  const: standard
              required: [type]
            - $ref: '#/components/schemas/RehypeInitializer'
      required: [type, curveConfig]
    DynamicCurveConfig:
      type: object
      additionalProperties: false
      properties:
        type:
          const: range
        marketCapStartUsd:
          type: number
          exclusiveMinimum: 0
        marketCapMinUsd:
          type: number
          exclusiveMinimum: 0
        minProceeds:
          type: string
          pattern: '^\d+(\.\d+)?$'
        maxProceeds:
          type: string
          pattern: '^\d+(\.\d+)?$'
        durationSeconds:
          type: integer
          minimum: 1
          description: Must be evenly divisible by epochLengthSeconds after defaults are applied.
        epochLengthSeconds:
          type: integer
          minimum: 1
          description: Must divide durationSeconds evenly after defaults are applied.
        fee:
          type: integer
          minimum: 0
          maximum: 100000
        tickSpacing:
          type: integer
          minimum: 1
          maximum: 30
          description: Required when fee is not one of 100, 500, 3000, or 10000.
        gamma:
          type: integer
          minimum: 1
          maximum: 8388607
          description: Must be divisible by the effective tickSpacing.
        numPdSlugs:
          type: integer
          minimum: 1
          maximum: 15
      required: [type, marketCapStartUsd, marketCapMinUsd, minProceeds, maxProceeds]
    DynamicAuction:
      type: object
      additionalProperties: false
      properties:
        type:
          const: dynamic
        curveConfig:
          $ref: '#/components/schemas/DynamicCurveConfig'
      required: [type, curveConfig]
    UniswapV2Migration:
      type: object
      description: |
        An optional fee beneficiary receives the selected integer percentage of
        numeraire proceeds. The migration sends 95% of LP positions to the
        migration recipient and 5% to a one-year locker whose exit fees accrue
        to the Airlock owner.
      additionalProperties: false
      properties:
        type:
          const: uniswapV2
        feeBeneficiary:
          type: object
          additionalProperties: false
          properties:
            address:
              $ref: '#/components/schemas/NonZeroHexAddress'
            percentage:
              type: integer
              minimum: 1
              maximum: 50
          required: [address, percentage]
      required: [type]
    UniswapV4Migration:
      type: object
      additionalProperties: false
      description: >-
        Creates a fixed-fee Uniswap V4 pool through DopplerHookMigrator. Add
        rehype to use RehypeDopplerHookMigrator and its separate static hook fee.
      properties:
        type:
          const: uniswapV4
        fee:
          type: integer
          minimum: 0
          maximum: 150000
        tickSpacing:
          type: integer
          minimum: 1
          maximum: 32767
        lockDurationSeconds:
          type: integer
          minimum: 0
          maximum: 4294967295
        rehype:
          type: object
          additionalProperties: false
          properties:
            buybackDestination:
              $ref: '#/components/schemas/NonZeroHexAddress'
            customFee:
              type: integer
              minimum: 0
              maximum: 1000000
              description: Static Rehype hook fee, separate from the Uniswap V4 LP fee.
            feeRoutingMode:
              type: string
              enum: [directBuyback, routeToBeneficiaryFees]
              default: directBuyback
            feeDistributionInfo:
              $ref: '#/components/schemas/RehypeFeeDistributionInfo'
          required: [buybackDestination, customFee, feeDistributionInfo]
      required: [type, fee, tickSpacing, lockDurationSeconds]
    EvmStaticCreateLaunchRequest:
      type: object
      additionalProperties: false
      properties:
        chainId:
          type: integer
          enum: [1, 143, 4663, 8453, 84532]
          description: Required when DEFAULT_CHAIN_ID is not configured. The requested chain must have its named RPC enabled.
        userAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        integrationAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        tokenMetadata:
          $ref: '#/components/schemas/TokenMetadata'
        economics:
          $ref: '#/components/schemas/Economics'
        pairing:
          $ref: '#/components/schemas/Pairing'
        pricing:
          $ref: '#/components/schemas/Pricing'
        poolFeeBeneficiaries:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PoolFeeBeneficiary'
        governance:
          $ref: '#/components/schemas/Governance'
        auction:
          $ref: '#/components/schemas/StaticAuction'
      required: [userAddress, tokenMetadata, economics, auction]
    EvmMulticurveCreateLaunchRequest:
      type: object
      additionalProperties: false
      properties:
        chainId:
          type: integer
          enum: [1, 143, 4663, 8453, 84532]
          description: Required when DEFAULT_CHAIN_ID is not configured. The requested chain must have its named RPC enabled.
        userAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        integrationAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        tokenMetadata:
          $ref: '#/components/schemas/TokenMetadata'
        economics:
          $ref: '#/components/schemas/Economics'
        pairing:
          $ref: '#/components/schemas/Pairing'
        pricing:
          $ref: '#/components/schemas/Pricing'
        poolFeeBeneficiaries:
          type: array
          maxItems: 10
          description: >-
            These beneficiaries lock the multicurve source pool and receive its fees.
          items:
            $ref: '#/components/schemas/PoolFeeBeneficiary'
        governance:
          $ref: '#/components/schemas/Governance'
        auction:
          $ref: '#/components/schemas/MulticurveAuction'
      required: [userAddress, tokenMetadata, economics, auction]
    EvmDynamicUniswapV2CreateLaunchRequest:
      type: object
      additionalProperties: false
      properties:
        chainId:
          type: integer
          enum: [1, 143, 4663, 8453, 84532]
          description: Required when DEFAULT_CHAIN_ID is not configured. The requested chain must have its named RPC enabled.
        userAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        integrationAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        tokenMetadata:
          $ref: '#/components/schemas/TokenMetadata'
        economics:
          $ref: '#/components/schemas/Economics'
        pairing:
          $ref: '#/components/schemas/Pairing'
        pricing:
          $ref: '#/components/schemas/Pricing'
        governance:
          $ref: '#/components/schemas/Governance'
        migration:
          $ref: '#/components/schemas/UniswapV2Migration'
        auction:
          $ref: '#/components/schemas/DynamicAuction'
      required: [userAddress, tokenMetadata, economics, migration, auction]
    EvmDynamicUniswapV4CreateLaunchRequest:
      type: object
      additionalProperties: false
      properties:
        chainId:
          type: integer
          enum: [1, 143, 4663, 8453, 84532]
          description: Required when DEFAULT_CHAIN_ID is not configured. The requested chain must have its named RPC enabled.
        userAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        integrationAddress:
          $ref: '#/components/schemas/NonZeroHexAddress'
        tokenMetadata:
          $ref: '#/components/schemas/TokenMetadata'
        economics:
          $ref: '#/components/schemas/Economics'
        pairing:
          $ref: '#/components/schemas/Pairing'
        pricing:
          $ref: '#/components/schemas/Pricing'
        poolFeeBeneficiaries:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PoolFeeBeneficiary'
        governance:
          $ref: '#/components/schemas/Governance'
        migration:
          $ref: '#/components/schemas/UniswapV4Migration'
        auction:
          $ref: '#/components/schemas/DynamicAuction'
      required: [userAddress, tokenMetadata, economics, migration, auction]
    EvmDynamicCreateLaunchRequest:
      oneOf:
        - $ref: '#/components/schemas/EvmDynamicUniswapV2CreateLaunchRequest'
        - $ref: '#/components/schemas/EvmDynamicUniswapV4CreateLaunchRequest'
    CreateLaunchRequest:
      oneOf:
        - $ref: '#/components/schemas/EvmStaticCreateLaunchRequest'
        - $ref: '#/components/schemas/EvmMulticurveCreateLaunchRequest'
        - $ref: '#/components/schemas/EvmDynamicCreateLaunchRequest'
