    SolanaNetwork:
      type: string
      enum: [solanaDevnet, solanaMainnetBeta]
      description: solanaMainnetBeta is recognized but not supported for execution.
    DedicatedSolanaNetwork:
      type: string
      enum: [devnet, mainnet-beta]
      description: mainnet-beta is recognized but not supported for execution.
    SolanaAddress:
      type: string
      description: Valid base58 Solana address.
    SolanaTokenMetadata:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        symbol:
          type: string
          minLength: 1
          maxLength: 10
        tokenURI:
          type: string
          minLength: 1
          maxLength: 200
      required: [name, symbol, tokenURI]
    SolanaEconomics:
      type: object
      additionalProperties: false
      properties:
        totalSupply:
          type: string
          pattern: '^\d+$'
          description: Positive u64 integer string.
        baseForDistribution:
          type: string
          pattern: '^\d+$'
          description: Optional non-negative u64 integer string.
        baseForLiquidity:
          type: string
          pattern: '^\d+$'
          description: Optional non-negative u64 integer string.
      required: [totalSupply]
    SolanaPairing:
      type: object
      additionalProperties: false
      properties:
        numeraireAddress:
          $ref: '#/components/schemas/SolanaAddress'
    SolanaPricing:
      type: object
      additionalProperties: false
      properties:
        numerairePriceUsd:
          type: number
          exclusiveMinimum: 0
    SolanaFeeBeneficiary:
      type: object
      additionalProperties: false
      properties:
        address:
          $ref: '#/components/schemas/SolanaAddress'
        shareBps:
          type: integer
          minimum: 1
          maximum: 10000
      required: [address, shareBps]
    SolanaMigration:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: none
        supportCpmm:
          type: boolean
          default: false
          description: >
            When true, register the launch with the CPMM migrator. All
            API-created launches use Doppler launch hook v1; migration
            registration and hook features are independent.
        minimumQuoteRaise:
          type: string
          pattern: '^\d+$'
          description: Positive u64 integer string, required when supportCpmm is true.
      required: [type]
    SolanaCurveConfig:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: range
        marketCapStartUsd:
          type: number
          exclusiveMinimum: 0
        marketCapEndUsd:
          type: number
          exclusiveMinimum: 0
      required: [type, marketCapStartUsd, marketCapEndUsd]
    SolanaCosignerGateExpiry:
      type: object
      additionalProperties: false
      description: Omit expiry or use disabled for an indefinite managed cosigner gate.
      properties:
        mode:
          type: string
          enum: [disabled, unixTimestamp]
        value:
          type: string
          pattern: '^\d+$'
          description: Required for unixTimestamp mode; omitted for indefinite disabled mode.
      required: [mode]
    SolanaCosignerGate:
      type: object
      additionalProperties: false
      description: >
        Doppler-managed cosigning through Doppler launch hook v1. The API
        resolves the canonical signer from the on-chain hook config. It can
        be used with or without CPMM migration and combined with auction.dynamicFee.
      properties:
        type:
          type: string
          const: cosigner
        expiry:
          $ref: '#/components/schemas/SolanaCosignerGateExpiry'
      required: [type]
    SolanaDynamicFee:
      type: object
      additionalProperties: false
      description: >
        Dynamic fee schedule for Doppler launch hook v1 launches. Omit startingTime
        or set it to "0" to normalize the schedule start to launch creation.
        The effective swap fee is the greater of the schedule fee and
        swapFeeBps.
      properties:
        startingTime:
          type: string
          pattern: '^\d+$'
          description: Optional non-negative i64 integer string.
        startFeeBps:
          type: integer
          minimum: 0
          maximum: 10000
        endFeeBps:
          type: integer
          minimum: 0
          maximum: 10000
        durationSeconds:
          type: string
          pattern: '^\d+$'
          description: Non-negative u32 integer string; non-zero when the fee decays.
      required: [startFeeBps, endFeeBps, durationSeconds]
    SolanaAuction:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: xyk
        curveConfig:
          $ref: '#/components/schemas/SolanaCurveConfig'
        curveFeeBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Must equal swapFeeBps when both are supplied.
        swapFeeBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Must equal curveFeeBps when both are supplied.
        allowBuy:
          type: boolean
        allowSell:
          type: boolean
        cosignerGate:
          $ref: '#/components/schemas/SolanaCosignerGate'
        dynamicFee:
          $ref: '#/components/schemas/SolanaDynamicFee'
      required: [type, curveConfig]
    DedicatedSolanaCreateLaunchRequest:
      type: object
      additionalProperties: false
      properties:
        network:
          $ref: '#/components/schemas/DedicatedSolanaNetwork'
        tokenMetadata:
          $ref: '#/components/schemas/SolanaTokenMetadata'
        economics:
          $ref: '#/components/schemas/SolanaEconomics'
        pairing:
          $ref: '#/components/schemas/SolanaPairing'
        pricing:
          $ref: '#/components/schemas/SolanaPricing'
        feeBeneficiaries:
          type: array
          maxItems: 8
          description: Non-empty custom shares must sum to 10000 and use unique addresses.
          items:
            $ref: '#/components/schemas/SolanaFeeBeneficiary'
        governance:
          type: boolean
          enum: [false]
        migration:
          $ref: '#/components/schemas/SolanaMigration'
        auction:
          $ref: '#/components/schemas/SolanaAuction'
      required: [tokenMetadata, economics, auction]
    GenericSolanaCreateLaunchRequest:
      type: object
      additionalProperties: false
      properties:
        network:
          $ref: '#/components/schemas/SolanaNetwork'
        tokenMetadata:
          $ref: '#/components/schemas/SolanaTokenMetadata'
        economics:
          $ref: '#/components/schemas/SolanaEconomics'
        pairing:
          $ref: '#/components/schemas/SolanaPairing'
        pricing:
          $ref: '#/components/schemas/SolanaPricing'
        feeBeneficiaries:
          type: array
          maxItems: 8
          description: Non-empty custom shares must sum to 10000 and use unique addresses.
          items:
            $ref: '#/components/schemas/SolanaFeeBeneficiary'
        governance:
          type: boolean
          enum: [false]
        migration:
          $ref: '#/components/schemas/SolanaMigration'
        auction:
          $ref: '#/components/schemas/SolanaAuction'
      required: [network, tokenMetadata, economics, auction]
      example:
        {
          'network': 'solanaDevnet',
          'tokenMetadata': { 'name': 'Solana Token', 'symbol': 'SOL', 'tokenURI': 'ipfs://solana' },
          'economics': { 'totalSupply': '1000000000' },
          'feeBeneficiaries':
            [{ 'address': '11111111111111111111111111111111', 'shareBps': 10000 }],
          'governance': false,
          'migration': { 'type': 'none' },
          'auction':
            {
              'type': 'xyk',
              'curveConfig': { 'type': 'range', 'marketCapStartUsd': 100, 'marketCapEndUsd': 1000 },
            },
        }
    EffectiveLaunchConfig:
      type: object
      properties:
        tokensForSale:
          $ref: '#/components/schemas/IntegerString'
        allocationAmount:
          $ref: '#/components/schemas/IntegerString'
        vestingAllocations:
          type: array
          items:
            $ref: '#/components/schemas/VestingAllocation'
        numeraireAddress:
          $ref: '#/components/schemas/HexAddress'
        numerairePriceUsd:
          type: number
        poolFeeBeneficiariesSource:
          type: string
          enum: [default, request, none]
        initializer:
          type: object
          properties:
            type:
              type: string
          required: [type]
      required:
        [
          tokensForSale,
          allocationAmount,
          vestingAllocations,
          numeraireAddress,
          numerairePriceUsd,
          poolFeeBeneficiariesSource,
        ]
    CreateLaunchResponse:
