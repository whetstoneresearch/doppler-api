          quoteMint,
          baseVault,
          quoteVault,
          baseTotalSupply,
          baseForDistribution,
          baseForLiquidity,
          baseForCurve,
          curveVirtualBase,
          curveVirtualQuote,
          curveFeeBps,
          swapFeeBps,
          allowBuy,
          allowSell,
          hookProgram,
          hookFlags,
          migratorProgram,
          quoteDeposited,
          tokenDecimals,
        ]
    LaunchStatusResult:
      type: object
      additionalProperties: false
      properties:
        tokenAddress:
          $ref: '#/components/schemas/HexAddress'
        poolOrHookAddress:
          $ref: '#/components/schemas/HexAddress'
        poolId:
          $ref: '#/components/schemas/HexHash'
        blockNumber:
          $ref: '#/components/schemas/IntegerString'
      required: [tokenAddress, poolOrHookAddress, poolId, blockNumber]
    LaunchStatusResponse:
      type: object
      additionalProperties: false
      properties:
        launchId:
          type: string
        chainId:
          type: integer
          enum: [1, 143, 4663, 8453, 84532]
        txHash:
          $ref: '#/components/schemas/HexHash'
        status:
          type: string
          enum: [pending, confirmed, reverted, not_found]
        confirmations:
          type: integer
          minimum: 0
        result:
          $ref: '#/components/schemas/LaunchStatusResult'
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [launchId, chainId, txHash, status, confirmations]
    ReadyCheck:
      type: object
      additionalProperties: false
      properties:
        chainId:
          type: integer
          enum: [1, 143, 4663, 8453, 84532]
        ok:
          type: boolean
        latestBlock:
          $ref: '#/components/schemas/IntegerString'
        error:
          type: string
      required: [chainId, ok]
    SolanaReadyCheck:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          enum: [rpcReachable, latestBlockhash, initializerConfig, addressLookupTable]
        ok:
          type: boolean
        error:
          type: string
      required: [name, ok]
    ReadyResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready, degraded]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadyCheck'
        solana:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            ok:
              type: boolean
            network:
              type: string
              enum: [solanaDevnet]
            checks:
              type: array
              items:
                $ref: '#/components/schemas/SolanaReadyCheck'
          required: [enabled, ok, checks]
      required: [status, checks, solana]
    MetricsResponse:
      type: object
      additionalProperties: false
      properties:
        startedAt:
          type: string
          format: date-time
        uptimeSec:
          type: integer
          minimum: 0
        http:
          type: object
          additionalProperties: false
          properties:
            totalRequests:
              type: integer
              minimum: 0
            byStatusClass:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
            avgDurationMs:
              type: number
              minimum: 0
          required: [totalRequests, byStatusClass, avgDurationMs]
      required: [startedAt, uptimeSec, http]
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      properties:
        defaultChainId:
          description: The configured request default, or null when every EVM launch request must include chainId.
          oneOf:
            - type: integer
              enum: [1, 143, 4663, 8453, 84532]
            - type: 'null'
        pricing:
          type: object
          properties:
            enabled:
              type: boolean
            provider:
              type: string
          required: [enabled, provider]
        chains:
          type: array
          items:
            type: object
            properties:
              chainId:
                type: integer
                enum: [1, 143, 4663, 8453, 84532]
              auctionTypes:
                type: array
                items:
                  type: string
                  enum: [static, multicurve, dynamic]
              multicurveInitializers:
                type: array
                items:
                  type: string
                  enum: [rehype]
              migrationModes:
                type: array
                items:
                  type: string
                  enum: [uniswapV2, uniswapV4]
              governanceModes:
                type: array
                items:
                  type: string
                  enum: [noOp, default, custom]
              governanceEnabled:
                type: boolean
            required:
              - chainId
              - auctionTypes
              - multicurveInitializers
              - migrationModes
              - governanceModes
              - governanceEnabled
        solana:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            supportedNetworks:
              type: array
              items:
                $ref: '#/components/schemas/SolanaNetwork'
            unsupportedNetworks:
              type: array
              items:
                $ref: '#/components/schemas/SolanaNetwork'
            dedicatedRouteInputAliases:
              type: array
              items:
                $ref: '#/components/schemas/DedicatedSolanaNetwork'
            creationOnly:
              type: boolean
              const: true
            numeraireAddress:
              $ref: '#/components/schemas/SolanaAddress'
            priceResolutionModes:
              type: array
              items:
                type: string
                enum: [request, fixed, coingecko]
          required:
            [
              enabled,
              supportedNetworks,
              unsupportedNetworks,
              dedicatedRouteInputAliases,
              creationOnly,
              numeraireAddress,
              priceResolutionModes,
            ]
      required: [defaultChainId, pricing, chains, solana]
